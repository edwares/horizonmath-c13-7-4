name: regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline and exact-proof dependencies
        run: python -m pip install -e ".[proof]"

      - name: Run horizonlink regressions
        run: python -m unittest discover -s tests -v

      - name: Run catalog-audit tests
        run: >-
          PYTHONPATH=catalog_audit/src
          python -m unittest discover -s catalog_audit/tests -v

      - name: Verify source-tree manifest
        run: python scripts/build_source_manifest.py --check
